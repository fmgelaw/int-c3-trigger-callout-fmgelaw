name: Apex Unit Tests Manually

on:
    workflow_dispatch:
        inputs:
            auth_url:
                description: 'Salesforce Dev Hub Auth URL (optional)'
                required: false
                type: string

jobs:
    run-tests:
        permissions:
          contents: read
          pull-requests: write
        uses: Cloud-Code-Academy/integration-developer-materials/.github/workflows/reusable-apex-tests.yml@main
        with:
            auth_url: ${{ inputs.auth_url }}
        secrets: inherit